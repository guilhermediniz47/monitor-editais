# ============================================================
#  Build do MonitorEditais.exe NA NUVEM (sem Python na sua maquina)
# ============================================================
# Como usar:
#   1) Crie uma conta gratuita em https://github.com
#   2) Crie um repositorio novo (ex.: "monitor-editais").
#   3) Envie para ele os arquivos:
#        - monitor_editais_pncp.py
#        - requirements.txt
#        - watchlist_editais.xlsx
#      e coloque ESTE arquivo em:  .github/workflows/build-exe.yml
#   4) No repositorio, aba "Actions", rode o workflow "Build EXE".
#   5) Ao terminar, baixe o artefato "MonitorEditais-Windows" -> tem o .exe.
# Tudo isso roda em uma maquina Windows do GitHub, de graca. Voce so baixa.
# ============================================================

name: Build EXE

on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar o executavel
        run: |
          pyinstaller --onefile --console --name MonitorEditais --collect-all holidays monitor_editais_pncp.py

      - name: Montar pasta de entrega
        run: |
          mkdir MonitorEditais_PRONTO
          copy dist\MonitorEditais.exe MonitorEditais_PRONTO\
          copy watchlist_editais.xlsx MonitorEditais_PRONTO\

      - name: Publicar o artefato (.exe + planilha)
        uses: actions/upload-artifact@v4
        with:
          name: MonitorEditais-Windows
          path: MonitorEditais_PRONTO
